<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Master</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">AI</div>
      <span>AI Master</span>
    </div>

    <button id="newChatBtn" class="new-chat-btn">
      ＋ New Chat
    </button>

    <nav>

      <button class="nav-item active" data-page="chat">
        <span>🤖</span>
        AI Chat
      </button>

      <button class="nav-item" data-page="dashboard">
        <span>🏠</span>
        Dashboard
      </button>

      <button class="nav-item" data-page="audio">
        <span>🔊</span>
        Audio
      </button>

      <button class="nav-item" data-page="video">
        <span>🎬</span>
        Video
      </button>

      <button class="nav-item" data-page="images">
        <span>🖼️</span>
        Images
      </button>

      <button class="nav-item" data-page="social">
        <span>📱</span>
        Social Media
      </button>

      <button class="nav-item" data-page="memory">
        <span>🧠</span>
        Memory
      </button>

    </nav>

    <div class="sidebar-bottom">

      <button class="nav-item">
        <span>⚙️</span>
        Settings
      </button>

      <!-- CREATOR -->
      <div class="creator-credit">
        <small>Created by</small>
        <strong>Trevor Githinji</strong>
      </div>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="main chat-main">

    <!-- TOP BAR -->
    <header class="topbar chat-topbar">

      <div class="chat-title">

        <div class="ai-avatar">
          AI
        </div>

        <div>
          <h1>AI Master</h1>

          <p>
            <span class="status-dot"></span>
            Online
          </p>
        </div>

      </div>

      <button
        id="topNewChatBtn"
        class="top-new-chat"
      >
        ＋ New Chat
      </button>

    </header>


    <!-- CHAT AREA -->
    <section
      id="chatMessages"
      class="chat-messages"
    >

      <!-- WELCOME -->
      <div
        id="welcomeScreen"
        class="welcome-screen"
      >

        <div class="welcome-avatar">
          🤖
        </div>

        <h2>
          How can I help you today?
        </h2>

        <p>
          I'm AI Master. Ask me anything,
          create content, brainstorm ideas,
          write code, or solve a problem.
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            data-prompt="Explain artificial intelligence in simple terms."
          >
            💡 Explain something
          </button>

          <button
            class="suggestion"
            data-prompt="Give me 5 creative business ideas I can start."
          >
            💼 Business ideas
          </button>

          <button
            class="suggestion"
            data-prompt="Help me write a professional message."
          >
            ✍️ Help me write
          </button>

          <button
            class="suggestion"
            data-prompt="Teach me something interesting today."
          >
            🧠 Teach me
          </button>

        </div>

      </div>

    </section>


    <!-- THINKING INDICATOR -->
    <div
      id="typingIndicator"
      class="typing-indicator hidden"
    >

      <div class="message-avatar ai-message-avatar">
        AI
      </div>

      <div class="typing-content">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>


    <!-- INPUT -->
    <section class="chat-input-section">

      <div class="chat-input-wrapper">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message AI Master..."
          autocomplete="off"
        ></textarea>

        <button
          id="generateBtn"
          class="send-btn"
          aria-label="Send message"
        >
          ➤
        </button>

      </div>

      <div class="input-footer">

        <span>
          AI Master can make mistakes.
          Check important information.
        </span>

        <select
          id="outputType"
          class="hidden"
        >
          <option value="text">Text</option>
          <option value="audio">Audio</option>
          <option value="video">Video</option>
          <option value="image">Image</option>
        </select>

      </div>

    </section>

  </main>

</div>


<script src="/app.js"></script>

</body>
</html>
